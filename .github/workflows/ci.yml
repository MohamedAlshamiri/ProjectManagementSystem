name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend - .NET 8 build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Backend/ProjectManagement/ProjectManagement.csproj

      - name: Build
        run: dotnet build Backend/ProjectManagement/ProjectManagement.csproj --configuration Release --no-restore

  frontend:
    name: Frontend - Angular build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: Frontend/project-management-ui/package-lock.json

      - name: Install dependencies
        working-directory: Frontend/project-management-ui
        run: npm ci

      - name: Production build
        working-directory: Frontend/project-management-ui
        run: npm run build -- --configuration production
